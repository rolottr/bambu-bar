# docker compose -f shared/scripts/fleet/compose.yaml up --build
# Then: "build/App.noindex/Bambu Bar.app/Contents/MacOS/Bambu Bar" --emulator shared/scripts/fleet/out/BambuStudio.conf
services:
  fleet:
    build:
      context: ..
      dockerfile: fleet/Dockerfile
    environment:
      PUBLISHED_HOST: 127.0.0.1
      SSDP_TARGET: ${SSDP_TARGET:-}
      SPEED: ${SPEED:-1}
      SERIAL_CASE: ${SERIAL_CASE:-upper}
    ports:
      - "127.0.0.1:18801-18817:18801-18817"
    volumes:
      - ./out:/out
