; Bambu Bar desktop widget, Small (180 x 180 at 100 %). The meters here are
; only declared; @Resources\Scripts\widget.lua sets every text, position and colour from the state file.
; Ring and numbers first: what matters in each state, the active spool, then the job.
; Load it through an instance stub (see ..\README.md) or on its own, which follows the tray's printer.

[Rainmeter]
; Rainmeter 5.0 syntax (https://www.rainmeter.net/changes-5.0/): accurate text, [%Env] variables.
SyntaxVersion=2
; The app asks its widgets to redraw at once with !UpdateGroup BambuBar (WidgetHost).
Group=BambuBar
Update=1000
; The card plus a 16 px margin for the shadow. Logical pixels: Rainmeter 5.0 scales the skin with the display.
SkinWidth=212
SkinHeight=212
; Right click opens the app's own menu (P2.5). Any RightMouseUpAction also keeps Rainmeter's menu away
; (Skin::OnContextMenu in 5.0; Ctrl+right-click still shows it, accepted in the ledger).
RightMouseUpAction=["#BambuBarExe#" --widget-menu "#CURRENTCONFIG#"]
@Include=#@#Variables.inc

[Metadata]
Name=Bambu Bar - Small
Author=NINA LABS, LLC
Information=Bambu Bar's Small desktop widget. Drawn from the state file the Bambu Bar app writes.
Version=1
License=MIT; part of Bambu Bar

[Variables]
Size=Small
CardW=180
CardH=180
@Include=#@#Head.inc

; The printer art the app renders (art-<hash>.png next to the state file). ArtA shows the settled picture;
[ArtA]
Meter=Image
@Inherit=StyleArt

; ArtB fades the next one in over it (300 ms; 400 ms when only the chamber light switched).
[ArtB]
Meter=Image
@Inherit=StyleArt

; Progress ring: track, two glow strokes and the gradient stroke (Lua builds the shapes; tweened 450 ms).
[Ring]
Meter=Shape
@Inherit=StyleShape

; Connecting: a 22 % arc turning at about 20 fps (ActionList2); static when motion is off.
[Spinner]
Meter=Shape
@Inherit=StyleShape

[DialPct]
Meter=String
@Inherit=StyleText

[DialIcon]
Meter=SVG
@Inherit=StyleIcon

[Caption]
Meter=String
@Inherit=StyleText

[Big]
Meter=String
@Inherit=StyleText

[Sub]
Meter=String
@Inherit=StyleText

[Reason]
Meter=String
@Inherit=StyleText

[TempIcon1]
Meter=SVG
@Inherit=StyleIcon

[Temp1]
Meter=String
@Inherit=StyleText

[TempIcon2]
Meter=SVG
@Inherit=StyleIcon

[Temp2]
Meter=String
@Inherit=StyleText

[TempIcon3]
Meter=SVG
@Inherit=StyleIcon

[Temp3]
Meter=String
@Inherit=StyleText

[ReasonFull]
Meter=String
@Inherit=StyleText

; The spool in use, and its name.
[ActiveSpool]
Meter=Shape
@Inherit=StyleShape

[ActiveSpoolText]
Meter=String
@Inherit=StyleText

; Spool swatches (tooltips: the spool's description).
[Swatch1]
Meter=Shape
@Inherit=StyleShape

[Swatch2]
Meter=Shape
@Inherit=StyleShape

[Swatch3]
Meter=Shape
@Inherit=StyleShape

[Swatch4]
Meter=Shape
@Inherit=StyleShape

[Swatch5]
Meter=Shape
@Inherit=StyleShape

[FootTitle]
Meter=String
@Inherit=StyleText

[FootDetail]
Meter=String
@Inherit=StyleText

[End]
@Include=#@#Tail.inc
