# XcodeGen spec for Bambu Bar. scripts/generate.sh (run by build.sh and appstore.sh) generates
# BambuBar.xcodeproj from it; the project itself is not checked in. Two app targets share every source:
#   BambuBar          Developer ID build for GitHub, with Sparkle for in-app updates. build.sh builds it
#                     (Release or Debug) and signs it by hand, outside Xcode.
#   BambuBarAppStore  sandboxed Mac App Store build without Sparkle (App Review doesn't allow apps to update
#                     themselves), signed automatically by Xcode in the AppStore configuration: archive the
#                     "BambuBar App Store" scheme (Product → Archive, or scripts/appstore.sh).
name: BambuBar
configs:
  Debug: debug
  Release: release
  AppStore: release
options:
  bundleIdPrefix: dev.rolottr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Release
  developmentLanguage: en
packages:
  # In-app updates for the Developer ID build: https://sparkle-project.org
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: PCZ6F8Q9DZ
    APP_GROUP: "$(DEVELOPMENT_TEAM).dev.rolottr.BambuBar"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    AppStore:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: Apple Development
      # macOS signs without profiles unless asked; TestFlight wants one in the app and in the widget.
      PROVISIONING_PROFILE_REQUIRED: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
targetTemplates:
  App:
    type: application
    platform: macOS
    sources:
      - path: Sources/BambuBar
      - path: Sources/Shared
      - path: Resources/Certificates
        type: folder
        buildPhase: resources
      - path: Resources/HMS
        buildPhase: resources
      - path: Resources/filaments.json
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: Resources/Printers
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rolottr.BambuBar
        PRODUCT_NAME: Bambu Bar
        PRODUCT_MODULE_NAME: BambuBar
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BambuBarWidget
        embed: true
        codeSign: true
targets:
  BambuBar:
    templates: [App]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/Signing/BambuBar.entitlements
    dependencies:
      - package: Sparkle
  BambuBarAppStore:
    templates: [App]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/Signing/BambuBar-AppStore.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
  BambuBarWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/BambuBarWidget
      - path: Sources/Shared
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Printers
        buildPhase: resources
        excludes:
          - "*.usdz"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rolottr.BambuBar.Widget
        PRODUCT_NAME: BambuBarWidget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Signing/BambuBarWidget.entitlements
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  # Unit tests (scripts/test.sh): camera protocol parsing, video depacketizing, slicer import, discovery and saved
  # printers. They compile the few files they cover instead of loading the app, so nothing launches or connects.
  BambuBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BambuBarTests
      - path: Sources/Shared
      - path: Sources/BambuBar/Printer/CameraProtocol.swift
      - path: Sources/BambuBar/Printer/VideoDepacketizer.swift
      - path: Sources/BambuBar/Printer/SlicerImport.swift
      - path: Sources/BambuBar/Printer/Discovery.swift
      - path: Sources/BambuBar/Printer/PrinterConfig.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
  # Integration tests (scripts/integration-test.sh) against the Docker simulators in scripts/integration: the mock
  # fleet (TLS MQTT, SSDP, a Bambu Studio settings file) and a mock camera (RTSPS and the JPEG stream). They
  # compile the real networking code, without the app, and skip themselves unless the simulators are running.
  BambuBarIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BambuBarIntegrationTests
      - path: Sources/Shared
      - path: Sources/BambuBar/Printer/BambuTrust.swift
      - path: Sources/BambuBar/Printer/MQTTClient.swift
      - path: Sources/BambuBar/Printer/CameraClient.swift
      - path: Sources/BambuBar/Printer/RTSPCameraClient.swift
      - path: Sources/BambuBar/Printer/JPEGCameraClient.swift
      - path: Sources/BambuBar/Printer/CameraProtocol.swift
      - path: Sources/BambuBar/Printer/VideoDepacketizer.swift
      - path: Sources/BambuBar/Printer/SlicerImport.swift
      - path: Sources/BambuBar/Printer/Discovery.swift
      - path: Sources/BambuBar/Printer/PrinterConfig.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  BambuBar:
    build:
      targets:
        BambuBar: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BambuBar App Store:
    build:
      targets:
        BambuBarAppStore: all
    run:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
  BambuBarTests:
    build:
      targets:
        BambuBarTests: [test]
    test:
      config: Debug
      targets:
        - BambuBarTests
  BambuBarIntegrationTests:
    build:
      targets:
        BambuBarIntegrationTests: [test]
    test:
      config: Debug
      targets:
        - BambuBarIntegrationTests
