name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS (universal)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and package (ad-hoc signed)
        run: ./scripts/package.sh
      - name: Verify checksum
        working-directory: build
        run: shasum -a 256 -c Bambu-Bar-*-macos.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Bambu-Bar-macos
          path: |
            build/Bambu-Bar-*-macos.zip
            build/Bambu-Bar-*-macos.zip.sha256
          if-no-files-found: error

  # The Windows app (docs/windows.md). Core has no Windows APIs, so its tests run on Linux.
  windows-core:
    name: Windows Core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
      - name: Test
        run: dotnet test --solution BambuBar.slnx

  windows:
    name: Windows (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: windows/global.json
      - name: Check the version matches project.yml
        run: |
          $expected = ./tools/version.ps1
          $built = dotnet msbuild src/BambuBar.Windows/BambuBar.Windows.csproj -getProperty:Version
          if ($built -ne $expected) { throw "Build version '$built' isn't project.yml's '$expected'" }
          "Version $built"
      - name: Fetch FFmpeg (the camera's decoder, LGPL)
        # windows/ffmpeg/version.txt pins the build and its SHA-256 per arch (ledger D17).
        run: |
          $pin = @{}
          Get-Content ffmpeg/version.txt | Where-Object { $_ -match '^([\w-]+)=(.+)$' } | ForEach-Object { $pin[$Matches[1]] = $Matches[2].Trim() }
          $rid = '${{ matrix.rid }}'
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-$rid.zip"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $pin["url-$rid"] -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $pin["sha256-$rid"]) { throw "FFmpeg for $rid has SHA-256 $hash, expected $($pin["sha256-$rid"])" }
          $unpacked = Join-Path $env:RUNNER_TEMP "ffmpeg-$rid"
          Expand-Archive $zip -DestinationPath $unpacked -Force
          $root = (Get-ChildItem $unpacked -Directory | Select-Object -First 1).FullName
          "FFMPEG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test
        if: matrix.rid == 'win-x64'
        # With the pinned FFmpeg, so the decoder tests run on Windows too (they skip without it).
        run: |
          $env:BAMBUBAR_FFMPEG = Join-Path $env:FFMPEG_ROOT bin
          dotnet test --solution BambuBar.slnx
      - name: Publish (self-contained)
        run: dotnet publish src/BambuBar.Windows -c Release -r ${{ matrix.rid }} -o ../build/windows/${{ matrix.rid }}
      - name: Bundle FFmpeg into ffmpeg\
        # Only what the camera loads: avcodec, avutil, swscale and swresample (avcodec links it), with FFmpeg's license
        # and where its source is (the LGPL's source offer; P5 attaches the source to releases).
        run: |
          $pin = @{}
          Get-Content ffmpeg/version.txt | Where-Object { $_ -match '^([\w-]+)=(.+)$' } | ForEach-Object { $pin[$Matches[1]] = $Matches[2].Trim() }
          $target = '../build/windows/${{ matrix.rid }}/ffmpeg'
          New-Item -ItemType Directory -Force $target | Out-Null
          foreach ($dll in $pin['dlls'] -split '\s+') { Copy-Item (Join-Path $env:FFMPEG_ROOT "bin/$dll") $target }
          Copy-Item (Join-Path $env:FFMPEG_ROOT 'LICENSE.txt') $target
          @(
            "Bambu Bar decodes its camera with FFmpeg $($pin['version']), unmodified, under the GNU Lesser General Public",
            "License version 3 (LICENSE.txt). These libraries are loaded at run time; you may replace them with your own build",
            "of the same major versions (avcodec-63, avutil-61, swscale-10, swresample-7).",
            "",
            "Build: $($pin['release'])",
            "Source: $($pin['source'])",
            "Build scripts and the libraries they link: $($pin['build-scripts'])"
          ) | Set-Content -Encoding utf8 (Join-Path $target 'SOURCE.txt')
          Get-ChildItem $target | Format-Table Name, Length
      - name: Snapshot the UI (tray glyphs, pages, camera)
        if: matrix.rid == 'win-x64'
        # A WinExe: PowerShell wouldn't wait for it on its own. camera.png goes through the bundled FFmpeg; a problem
        # there (it didn't load or decode) fails the job.
        run: |
          $p = Start-Process ../build/windows/win-x64/BambuBar.exe -ArgumentList '--snapshot', "$PWD/../build/snapshots" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "snapshot exited with $($p.ExitCode)" }
          Get-ChildItem ../build/snapshots
          if (Test-Path ../build/snapshots/camera-errors.txt) { Get-Content ../build/snapshots/camera-errors.txt; throw "The camera snapshot failed" }
      - name: Run the demo and screenshot the desktop
        if: matrix.rid == 'win-x64'
        run: |
          $p = Start-Process ../build/windows/win-x64/BambuBar.exe -ArgumentList '--demo', 'printing', '--fleet' -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "BambuBar.exe exited early with $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/../build/snapshots/desktop-demo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process $p
      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'win-x64'
        with:
          name: Bambu-Bar-windows-snapshots
          path: build/snapshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: Bambu-Bar-windows-${{ matrix.rid }}
          path: build/windows/${{ matrix.rid }}/
          if-no-files-found: error

  # The widget skins in the pinned Rainmeter on a real Windows desktop: screenshots and Rainmeter's log as artifacts.
  widgets:
    name: Widgets (Rainmeter smoke)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Load the skins and screenshot them
        shell: pwsh
        run: ./rainmeter/ci/smoke.ps1 -Out build/widgets
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Bambu-Bar-widgets-smoke
          path: build/widgets/
